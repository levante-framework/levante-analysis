project:
  type: website
  output-dir: _site
  # One site, four sections. archive/, handoffs/ and planning/ are not
  # rendered, nor are two studies whose inputs no longer exist (the mrot item
  # sets and adaptive-flag missingness) until they are ported.
  render:
    - index.qmd
    - monitor/*.qmd
    - tasks/*.qmd
    - studies/index.qmd
    - studies/*/*.qmd
    - "!studies/2026-07_mrot-item-sets/"
    - "!studies/2026-06_adaptive-missingness/"
    - register/*.qmd

website:
  title: "LEVANTE analysis"
  repo-url: https://github.com/levante-framework/levante-analysis
  search: true
  page-navigation: true
  navbar:
    left:
      - text: Monitor
        href: monitor/index.qmd
      - text: Task reports
        href: tasks/index.qmd
      - text: Studies
        href: studies/index.qmd
      - text: Findings & decisions
        href: register/index.qmd
  sidebar:
    - title: "Monitor"
      style: docked
      contents:
        - monitor/index.qmd
        - monitor/network.qmd
        - monitor/snapshot.qmd
        - monitor/growth.qmd
        - monitor/structure.qmd
        - monitor/languages.qmd
        - monitor/downward_extension.qmd
    - title: "Task reports"
      contents:
        - tasks/index.qmd
        - tasks/memory.qmd
        - tasks/shape_rotation.qmd
        - tasks/sentence_understanding.qmd
        - tasks/vocab.qmd
        - tasks/roar_literacy.qmd
    - title: "Studies"
      contents:
        - studies/index.qmd
        - section: "2026-10 · H&F v2 redesign"
          contents: studies/2026-10_hf-v2-redesign/hearts_and_flowers_v2.qmd
        - section: "2026-09 · Stories (ToM)"
          contents: studies/2026-09_stories/stories.qmd
        - section: "2026-09 · TROG skin tone"
          contents: studies/2026-09_trog-skin-tone/trog_skin_tone.qmd
        - section: "2026-08 · Memory length"
          contents: studies/2026-08_memory-length/memory_length.qmd
        - section: "2026-08 · Within-child variability"
          contents:
            - studies/2026-08_within-child-variability/06_within_child_variability.qmd
            - studies/2026-08_within-child-variability/07_rt_variability.qmd
            - studies/2026-08_within-child-variability/08_accuracy_variability.qmd
        - section: "2026-07 · Battery length"
          contents: studies/2026-07_battery-length/05_battery_design.qmd
        - section: "2026-07 · ROAR-Sentence scoring"
          contents: studies/2026-07_sre-scoring/sre.qmd
        - section: "2026-07 · Same & Different scoring"
          contents: studies/2026-07_sds-scoring/same_different.qmd
        - section: "2026-07 · ROAR-Word engagement"
          contents: studies/2026-07_roar-word-engagement/roar_word.qmd
        - section: "2026-07 · Training vs development"
          contents: studies/2026-07_training-vs-development/training_vs_development.qmd
        - section: "2026-06 · ToM reality-check forensics"
          contents: studies/2026-06_tom-reality-check/tom_reality_check_bug.qmd
        - section: "2026-06 · IRT column-order bug"
          contents:
            - studies/2026-06_irt-column-order-bug/math_eap_vs_ml.qmd
            - studies/2026-06_irt-column-order-bug/corrected_trajectories.qmd
    - title: "Findings & decisions"
      contents:
        - register/index.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    df-print: paged
    fig-width: 9
    fig-height: 5.5

execute:
  # freeze: true = a global `quarto render` / `quarto publish` reuses the frozen
  # code outputs in _freeze/ and never re-executes chapters (prose still
  # re-renders). Refresh a chapter's outputs by rendering it individually:
  # `quarto render monitor/04_differentiation.qmd`. Set to `auto` to re-execute any
  # chapter whose source changed on a global render — but note that needs all
  # the data caches + Redivis access on the publishing machine.
  freeze: true
  warning: false
  message: false

# Keep figure PNGs small enough for Quarto Pub's per-file upload limit:
# render at 96 dpi without the 2× retina multiplier (dense scatter/spaghetti
# plots otherwise exceed ~1 MB and 413 on publish). After changing this, wipe
# `_freeze/` so figures actually re-render at the new size.
knitr:
  opts_chunk:
    fig.retina: 1
    dpi: 96
